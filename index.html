<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yaaroza</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      color: white;
    }

    .app {
      width: 100%;
      max-width: 420px;
      padding: 30px 22px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .tagline {
      color: #b8c0cc;
      margin-bottom: 35px;
    }

    .box {
      background: #1f2937;
      padding: 25px;
      border-radius: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 14px;
      border: none;
      border-radius: 12px;
      background: #374151;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .links {
      margin-top: 20px;
      color: #a78bfa;
      font-size: 14px;
    }

    .links span {
      margin: 0 8px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">Yaaroza</div>

    <div class="tagline">
      Meet • Talk • Play
    </div>

    <div class="box">

      <input
        type="tel"
        placeholder="Mobile Number"
      >

      <input
        type="password"
        placeholder="Password"
      >

      <button>
        Login
      </button>

      <div class="links">
        Create Account
        <span>•</span>
        Forgot Password
      </div>

    </div>

  </div>

</body>
</html>
