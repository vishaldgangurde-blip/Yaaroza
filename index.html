<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yaaroza</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0712;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #15101f;
      padding: 28px;
      border-radius: 22px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 38px;
    }

    .tagline {
      text-align: center;
      color: #aaa;
      margin: 8px 0 28px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #332743;
      border-radius: 12px;
      background: #0f0a17;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      background: #8b4dff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .link {
      text-align: center;
      margin-top: 18px;
      color: #b98cff;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #ddd;
      min-height: 22px;
    }

    .back {
      background: #292033;
    }
  </style>
</head>

<body>

<div class="box">

  <!-- LOGIN -->
  <div id="loginScreen">
    <h1>Yaaroza</h1>
    <div class="tagline">Meet • Talk • Play</div>

    <input
      id="loginPhone"
      type="tel"
      placeholder="Mobile number e.g. +919876543210"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
    >

    <button type="button" onclick="loginUser()">
      Login
    </button>

    <div class="link" onclick="showCreateAccount()">
      Create Account
    </div>

    <div class="link" onclick="showForgotPassword()">
      Forgot Password?
    </div>
  </div>


  <!-- CREATE ACCOUNT -->
  <div id="createScreen" class="hidden">

    <h1>Create Account</h1>
    <div class="tagline">Join Yaaroza</div>

    <input
      id="signupPhone"
      type="tel"
      placeholder="Mobile number e.g. +919876543210"
    >

    <input
      id="signupPassword"
      type="password"
      placeholder="Create password"
    >

    <input
      id="signupUsername"
      type="text"
      placeholder="Username"
    >

    <input
      id="signupName"
      type="text"
      placeholder="Full name"
    >

    <button type="button" onclick="createAccount()">
      Create Account
    </button>

    <button type="button" class="back" onclick="showLogin()">
      Back to Login
    </button>

  </div>


  <!-- FORGOT PASSWORD -->
  <div id="forgotScreen" class="hidden">

    <h1>Reset Password</h1>
    <div class="tagline">Reset your Yaaroza password</div>

    <input
      id="forgotPhone"
      type="tel"
      placeholder="Mobile number"
    >

    <button type="button" onclick="sendOTP()">
      Send OTP
    </button>

    <button type="button" class="back" onclick="showLogin()">
      Back to Login
    </button>

  </div>

  <div id="message"></div>

</div>


<script>

  // ==============================
  // SUPABASE CONNECTION
  // ==============================

  const SUPABASE_URL =
    "https://qkpljuksfgyyooythbjg.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_GQG4XSSgd7_eBOe18DkkMA_7PBuNZId";

  const { createClient } = supabase;

  const client = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  // ==============================
  // SCREEN FUNCTIONS
  // ==============================

  function showLogin() {
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("createScreen").classList.add("hidden");
    document.getElementById("forgotScreen").classList.add("hidden");
    clearMessage();
  }

  function showCreateAccount() {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("createScreen").classList.remove("hidden");
    document.getElementById("forgotScreen").classList.add("hidden");
    clearMessage();
  }

  function showForgotPassword() {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("createScreen").classList.add("hidden");
    document.getElementById("forgotScreen").classList.remove("hidden");
    clearMessage();
  }


  // ==============================
  // LOGIN
  // ==============================

  async function loginUser() {

    const phone =
      document.getElementById("loginPhone").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    if (!phone || !password) {
      showMessage("Mobile number aur password enter karo.");
      return;
    }

    showMessage("Logging in...");

    const { data, error } =
      await client.auth.signInWithPassword({
        phone: phone,
        password: password
      });

    if (error) {
      showMessage(error.message);
      return;
    }

    showMessage("Login successful! 🎉");

    console.log("Logged in user:", data.user);
  }


  // ==============================
  // CREATE ACCOUNT
  // ==============================

  async function createAccount() {

    const phone =
      document.getElementById("signupPhone").value.trim();

    const password =
      document.getElementById("signupPassword").value;

    const username =
      document.getElementById("signupUsername").value.trim();

    const fullName =
      document.getElementById("signupName").value.trim();

    if (!phone || !password || !username || !fullName) {
      showMessage("Saari details fill karo.");
      return;
    }

    if (password.length < 6) {
      showMessage("Password kam se kam 6 characters ka hona chahiye.");
      return;
    }

    showMessage("Creating account...");

    const { data, error } =
      await client.auth.signUp({
        phone: phone,
        password: password
      });

    if (error) {
      showMessage(error.message);
      return;
    }

    if (!data.user) {
      showMessage("Account create nahi ho paya.");
      return;
    }

    // Update automatically-created profile
    const { error: profileError } =
      await client
        .from("profiles")
        .update({
          username: username,
          full_name: fullName
        })
        .eq("id", data.user.id);

    if (profileError) {
      console.error(profileError);

      showMessage(
        "Account ban gaya, lekin profile save nahi hui."
      );

      return;
    }

    showMessage(
      "Account created successfully! 🎉"
    );
  }


  // ==============================
  // FORGOT PASSWORD
  // ==============================

  function sendOTP() {

    const phone =
      document.getElementById("forgotPhone").value.trim();

    if (!phone) {
      showMessage("Mobile number enter karo.");
      return;
    }

    showMessage(
      "OTP system setup hone ke baad SMS yahan aayega."
    );
  }


  // ==============================
  // MESSAGE
  // ==============================

  function showMessage(text) {
    document.getElementById("message").textContent = text;
  }

  function clearMessage() {
    document.getElementById("message").textContent = "";
  }

</script>

</body>
</html>
