<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yaaroza</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff4f81, #7b2cff);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 25px;
      padding: 30px 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .logo {
      text-align: center;
      font-size: 38px;
      font-weight: bold;
      color: #ff3f7f;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 5px;
      background: #f2f2f2;
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      border: none;
      background: transparent;
      padding: 12px 5px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      color: #666;
    }

    .tab.active {
      background: white;
      color: #ff3f7f;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #222;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: bold;
      color: #444;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #ff3f7f;
      box-shadow: 0 0 0 2px rgba(255,63,127,0.1);
    }

    .main-btn {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff3f7f, #8b35ff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .main-btn:active {
      transform: scale(0.98);
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
    }

    .message.show {
      display: block;
      background: #f3f3f3;
      color: #444;
    }

    .small-text {
      text-align: center;
      margin-top: 15px;
      color: #777;
      font-size: 13px;
    }

    .small-link {
      color: #ff3f7f;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    .terms {
      text-align: center;
      font-size: 11px;
      color: #999;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">Yaaroza</div>
    <div class="subtitle">Connect • Chat • Call • Make Friends</div>

    <div class="tabs">
      <button class="tab active" id="loginTab" onclick="showForm('login')">
        Login
      </button>

      <button class="tab" id="signupTab" onclick="showForm('signup')">
        Create Account
      </button>

      <button class="tab" id="forgotTab" onclick="showForm('forgot')">
        Forgot
      </button>
    </div>

    <!-- LOGIN -->
    <div class="form active" id="loginForm">

      <h2>Welcome Back</h2>

      <div class="input-group">
        <label>Mobile Number</label>
        <input
          type="tel"
          id="loginMobile"
          placeholder="Enter mobile number"
          maxlength="10"
        >
      </div>

      <div class="input-group">
        <label>Password</label>
        <input
          type="password"
          id="loginPassword"
          placeholder="Enter password"
        >
      </div>

      <button class="main-btn" onclick="loginUser()">
        Login
      </button>

      <div class="small-text">
        New to Yaaroza?
        <span class="small-link" onclick="showForm('signup')">
          Create Account
        </span>
      </div>

      <div class="small-text">
        <span class="small-link" onclick="showForm('forgot')">
          Forgot Password?
        </span>
      </div>

      <div class="message" id="loginMessage"></div>

    </div>


    <!-- CREATE ACCOUNT -->
    <div class="form" id="signupForm">

      <h2>Create Account</h2>

      <div class="input-group">
        <label>Your Name</label>
        <input
          type="text"
          id="signupName"
          placeholder="Enter your name"
        >
      </div>

      <div class="input-group">
        <label>Mobile Number</label>
        <input
          type="tel"
          id="signupMobile"
          placeholder="Enter mobile number"
          maxlength="10"
        >
      </div>

      <div class="input-group">
        <label>Password</label>
        <input
          type="password"
          id="signupPassword"
          placeholder="Create password"
        >
      </div>

      <div class="input-group">
        <label>Confirm Password</label>
        <input
          type="password"
          id="signupConfirm"
          placeholder="Confirm password"
        >
      </div>

      <button class="main-btn" onclick="createAccount()">
        Create Account
      </button>

      <div class="small-text">
        Already have an account?
        <span class="small-link" onclick="showForm('login')">
          Login
        </span>
      </div>

      <div class="message" id="signupMessage"></div>

    </div>


    <!-- FORGOT PASSWORD -->
    <div class="form" id="forgotForm">

      <h2>Forgot Password</h2>

      <div class="input-group">
        <label>Mobile Number</label>
        <input
          type="tel"
          id="forgotMobile"
          placeholder="Enter registered mobile number"
          maxlength="10"
        >
      </div>

      <button class="main-btn" onclick="sendForgotOTP()">
        Send OTP
      </button>

      <div class="small-text">
        Remember your password?
        <span class="small-link" onclick="showForm('login')">
          Back to Login
        </span>
      </div>

      <div class="message" id="forgotMessage"></div>

    </div>

    <div class="terms">
      By continuing, you agree to Yaaroza's Terms & Privacy Policy.
    </div>

  </div>


  <script>

    function showForm(formName) {

      document.querySelectorAll('.form').forEach(function(form) {
        form.classList.remove('active');
      });

      document.querySelectorAll('.tab').forEach(function(tab) {
        tab.classList.remove('active');
      });

      if (formName === 'login') {
        document.getElementById('loginForm').classList.add('active');
        document.getElementById('loginTab').classList.add('active');
      }

      if (formName === 'signup') {
        document.getElementById('signupForm').classList.add('active');
        document.getElementById('signupTab').classList.add('active');
      }

      if (formName === 'forgot') {
        document.getElementById('forgotForm').classList.add('active');
        document.getElementById('forgotTab').classList.add('active');
      }
    }


    function showMessage(id, text) {
      const box = document.getElementById(id);
      box.textContent = text;
      box.classList.add('show');
    }


    function loginUser() {

      const mobile = document.getElementById('loginMobile').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!mobile || !password) {
        showMessage(
          'loginMessage',
          'कृपया मोबाइल नंबर और पासवर्ड भरें।'
        );
        return;
      }

      showMessage(
        'loginMessage',
        'Login system तैयार है। Backend connection अगले step में जोड़ेंगे।'
      );
    }


    function createAccount() {

      const name = document.getElementById('signupName').value.trim();
      const mobile = document.getElementById('signupMobile').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('signupConfirm').value;

      if (!name || !mobile || !password || !confirm) {
        showMessage(
          'signupMessage',
          'कृपया सभी जानकारी भरें।'
        );
        return;
      }

      if (password !== confirm) {
        showMessage(
          'signupMessage',
          'दोनों पासवर्ड एक जैसे होने चाहिए।'
        );
        return;
      }

      showMessage(
        'signupMessage',
        'Account form सही काम कर रहा है। OTP connection अगले step में जोड़ेंगे।'
      );
    }


    function sendForgotOTP() {

      const mobile = document.getElementById('forgotMobile').value.trim();

      if (!mobile) {
        showMessage(
          'forgotMessage',
          'कृपया अपना मोबाइल नंबर डालें।'
        );
        return;
      }

      showMessage(
        'forgotMessage',
        'Forgot Password form सही काम कर रहा है। OTP connection अगले step में जोड़ेंगे।'
      );
    }

  </script>

</body>
</html>
