<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <title>Yaaroza</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #111827, #4c1d95, #7c3aed);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: rgba(255, 255, 255, 0.11);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 24px;
      padding: 26px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand h1 {
      margin: 0;
      font-size: 36px;
      letter-spacing: 1px;
    }

    .brand p {
      margin: 7px 0 0;
      color: #dddddd;
      font-size: 14px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 7px;
      margin-bottom: 22px;
    }

    .tab {
      border: 0;
      padding: 12px 5px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.13);
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      background: #ffffff;
      color: #4c1d95;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    .form h2 {
      margin: 0 0 15px;
      font-size: 23px;
    }

    .input {
      width: 100%;
      padding: 14px;
      margin: 6px 0;
      border: 0;
      outline: none;
      border-radius: 11px;
      font-size: 15px;
      background: #ffffff;
      color: #111827;
    }

    .input::placeholder {
      color: #777777;
    }

    .button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 14px;
      margin-top: 10px;
      background: #ffffff;
      color: #4c1d95;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary-button {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 11px;
      padding: 12px;
      margin-top: 9px;
      background: rgba(255,255,255,0.08);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .otp-box {
      display: none;
      margin-top: 16px;
      padding-top: 8px;
    }

    .message {
      min-height: 20px;
      margin-top: 13px;
      padding: 10px;
      border-radius: 9px;
      background: rgba(0, 0, 0, 0.22);
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    .success {
      background: rgba(34, 197, 94, 0.20);
    }

    .error {
      background: rgba(239, 68, 68, 0.20);
    }

    .info {
      background: rgba(59, 130, 246, 0.20);
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: #cccccc;
      font-size: 12px;
      line-height: 1.5;
    }

    .logged-in {
      display: none;
      text-align: center;
    }

    .logged-in h2 {
      margin-top: 0;
    }

    .user-card {
      padding: 18px;
      margin-top: 15px;
      border-radius: 14px;
      background: rgba(255,255,255,0.09);
    }

    .logout {
      background: rgba(239,68,68,0.85);
      color: white;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="card">

    <div class="brand">
      <h1>Yaaroza</h1>
      <p>Connect • Chat • Call • Make Friends</p>
    </div>


    <!-- AUTH AREA -->

    <div id="authArea">

      <div class="tabs">

        <button
          id="loginTab"
          class="tab active"
          onclick="showForm('login')">
          Login
        </button>

        <button
          id="signupTab"
          class="tab"
          onclick="showForm('signup')">
          Create Account
        </button>

        <button
          id="forgotTab"
          class="tab"
          onclick="showForm('forgot')">
          Forgot
        </button>

      </div>


      <!-- LOGIN -->

      <div id="loginForm" class="form active">

        <h2>Welcome Back</h2>

        <input
          id="loginPhone"
          class="input"
          type="tel"
          inputmode="numeric"
          autocomplete="tel"
          placeholder="Mobile Number">

        <input
          id="loginPassword"
          class="input"
          type="password"
          autocomplete="current-password"
          placeholder="Password">

        <button
          id="loginButton"
          class="button"
          onclick="loginUser()">
          Login
        </button>

        <div
          id="loginMessage"
          class="message">
        </div>

      </div>


      <!-- CREATE ACCOUNT -->

      <div id="signupForm" class="form">

        <h2>Create Your Account</h2>

        <input
          id="signupName"
          class="input"
          type="text"
          autocomplete="name"
          placeholder="Your Name">

        <input
          id="signupPhone"
          class="input"
          type="tel"
          inputmode="numeric"
          autocomplete="tel"
          placeholder="Mobile Number">

        <input
          id="signupPassword"
          class="input"
          type="password"
          autocomplete="new-password"
          placeholder="Password">

        <input
          id="signupConfirm"
          class="input"
          type="password"
          autocomplete="new-password"
          placeholder="Confirm Password">

        <button
          id="signupButton"
          class="button"
          onclick="createAccount()">
          Create Account
        </button>


        <div
          id="signupOtpBox"
          class="otp-box">

          <input
            id="signupOtp"
            class="input"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="Enter 6-Digit OTP">

          <button
            id="signupVerifyButton"
            class="button"
            onclick="verifySignupOtp()">
            Verify OTP
          </button>

          <button
            class="secondary-button"
            onclick="resendSignupOtp()">
            Resend OTP
          </button>

        </div>


        <div
          id="signupMessage"
          class="message">
        </div>

      </div>


      <!-- FORGOT PASSWORD -->

      <div id="forgotForm" class="form">

        <h2>Reset Password</h2>

        <input
          id="forgotPhone"
          class="input"
          type="tel"
          inputmode="numeric"
          autocomplete="tel"
          placeholder="Mobile Number">

        <button
          id="forgotButton"
          class="button"
          onclick="sendForgotOtp()">
          Send OTP
        </button>


        <div
          id="forgotOtpBox"
          class="otp-box">

          <input
            id="forgotOtp"
            class="input"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="Enter 6-Digit OTP">

          <input
            id="newPassword"
            class="input"
            type="password"
            autocomplete="new-password"
            placeholder="New Password">

          <input
            id="confirmNewPassword"
            class="input"
            type="password"
            autocomplete="new-password"
            placeholder="Confirm New Password">

          <button
            id="resetButton"
            class="button"
            onclick="verifyForgotOtp()">
            Verify OTP & Change Password
          </button>

        </div>


        <div
          id="forgotMessage"
          class="message">
        </div>

      </div>

    </div>


    <!-- LOGGED IN AREA -->

    <div
      id="loggedInArea"
      class="logged-in">

      <h2>Welcome to Yaaroza</h2>

      <p>You are successfully logged in.</p>

      <div class="user-card">
        <div id="userName"></div>
        <div id="userPhone"></div>
      </div>

      <button
        class="button logout"
        onclick="logoutUser()">
        Logout
      </button>

      <div
        id="logoutMessage"
        class="message">
      </div>

    </div>


    <div class="footer">
      By continuing, you agree to Yaaroza's Terms & Privacy Policy.
    </div>

  </div>

</div>


<script>

  /* ==========================================
     SUPABASE CONFIGURATION
     ========================================== */

  const SUPABASE_URL =
    "https://qkpljuksfgyyooythbjg.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_GQG4XSSgd7_eBOe18DkkMA_7PBuNZId";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* ==========================================
     PHONE FORMAT
     ========================================== */

  function formatPhone(value) {

    let phone = value.trim();

    phone = phone.replace(/\s+/g, "");

    if (phone.startsWith("+")) {
      return phone;
    }

    if (phone.startsWith("91") && phone.length === 12) {
      return "+" + phone;
    }

    if (phone.length === 10) {
      return "+91" + phone;
    }

    return phone;
  }


  /* ==========================================
     MESSAGE HELPER
     ========================================== */

  function setMessage(id, text, type = "info") {

    const element = document.getElementById(id);

    element.innerText = text;

    element.className = "message " + type;
  }


  /* ==========================================
     TAB SWITCHING
     ========================================== */

  function showForm(type) {

    document
      .querySelectorAll(".form")
      .forEach(form => {
        form.classList.remove("active");
      });

    document
      .querySelectorAll(".tab")
      .forEach(button => {
        button.classList.remove("active");
      });


    if (type === "login") {

      document
        .getElementById("loginForm")
        .classList.add("active");

      document
        .getElementById("loginTab")
        .classList.add("active");
    }


    if (type === "signup") {

      document
        .getElementById("signupForm")
        .classList.add("active");

      document
        .getElementById("signupTab")
        .classList.add("active");
    }


    if (type === "forgot") {

      document
        .getElementById("forgotForm")
        .classList.add("active");

      document
        .getElementById("forgotTab")
        .classList.add("active");
    }
  }


  /* ==========================================
     CREATE ACCOUNT
     ========================================== */

  async function createAccount() {

    const name =
      document.getElementById("signupName").value.trim();

    const phone =
      formatPhone(
        document.getElementById("signupPhone").value
      );

    const password =
      document.getElementById("signupPassword").value;

    const confirmPassword =
      document.getElementById("signupConfirm").value;


    if (!name || !phone || !password || !confirmPassword) {

      setMessage(
        "signupMessage",
        "Please complete all fields.",
        "error"
      );

      return;
    }


    if (password.length < 6) {

      setMessage(
        "signupMessage",
        "Password must contain at least 6 characters.",
        "error"
      );

      return;
    }


    if (password !== confirmPassword) {

      setMessage(
        "signupMessage",
        "Passwords do not match.",
        "error"
      );

      return;
    }


    const button =
      document.getElementById("signupButton");

    button.disabled = true;

    button.innerText = "Creating Account...";


    setMessage(
      "signupMessage",
      "Creating your account...",
      "info"
    );


    try {

      const { data, error } =
        await supabaseClient.auth.signUp({

          phone: phone,

          password: password,

          options: {

            channel: "sms",

            data: {
              display_name: name
            }

          }

        });


      if (error) {

        setMessage(
          "signupMessage",
          error.message,
          "error"
        );

        button.disabled = false;
        button.innerText = "Create Account";

        return;
      }


      document
        .getElementById("signupOtpBox")
        .style.display = "block";


      setMessage(
        "signupMessage",
        "OTP sent. Enter the 6-digit OTP to verify your phone.",
        "success"
      );


      button.disabled = false;
      button.innerText = "Create Account";


    } catch (error) {

      setMessage(
        "signupMessage",
        error.message || "Something went wrong.",
        "error"
      );

      button.disabled = false;
      button.innerText = "Create Account";
    }
  }


  /* ==========================================
     VERIFY SIGNUP OTP
     ========================================== */

  async function verifySignupOtp() {

    const phone =
      formatPhone(
        document.getElementById("signupPhone").value
      );

    const token =
      document
        .getElementById("signupOtp")
        .value
        .trim();


    if (!token || token.length !== 6) {

      setMessage(
        "signupMessage",
        "Please enter the 6-digit OTP.",
        "error"
      );

      return;
    }


    const button =
      document.getElementById("signupVerifyButton");

    button.disabled = true;

    button.innerText = "Verifying...";


    try {

      const { data, error } =
        await supabaseClient.auth.verifyOtp({

          phone: phone,

          token: token,

          type: "sms"

        });


      if (error) {

        setMessage(
          "signupMessage",
          error.message,
          "error"
        );

        button.disabled = false;
        button.innerText = "Verify OTP";

        return;
      }


      setMessage(
        "signupMessage",
        "Your account has been created successfully.",
        "success"
      );


      setTimeout(() => {

        showLoggedInUser(data.user);

      }, 800);


    } catch (error) {

      setMessage(
        "signupMessage",
        error.message || "OTP verification failed.",
        "error"
      );

      button.disabled = false;
      button.innerText = "Verify OTP";
    }
  }


  /* ==========================================
     RESEND SIGNUP OTP
     ========================================== */

  async function resendSignupOtp() {

    const phone =
      formatPhone(
        document.getElementById("signupPhone").value
      );


    if (!phone) {

      setMessage(
        "signupMessage",
        "Please enter your mobile number first.",
        "error"
      );

      return;
    }


    setMessage(
      "signupMessage",
      "Sending a new OTP...",
      "info"
    );


    try {

      const { error } =
        await supabaseClient.auth.signInWithOtp({

          phone: phone,

          options: {
            shouldCreateUser: false,
            channel: "sms"
          }

        });


      if (error) {

        setMessage(
          "signupMessage",
          error.message,
          "error"
        );

        return;
      }


      setMessage(
        "signupMessage",
        "A new OTP has been sent.",
        "success"
      );


    } catch (error) {

      setMessage(
        "signupMessage",
        error.message || "Unable to resend OTP.",
        "error"
      );
    }
  }


  /* ==========================================
     LOGIN
     ========================================== */

  async function loginUser() {

    const phone =
      formatPhone(
        document.getElementById("loginPhone").value
      );

    const password =
      document.getElementById("loginPassword").value;


    if (!phone || !password) {

      setMessage(
        "loginMessage",
        "Please enter your mobile number and password.",
        "error"
      );

      return;
    }


    const button =
      document.getElementById("loginButton");

    button.disabled = true;

    button.innerText = "Logging In...";


    setMessage(
      "loginMessage",
      "Signing you in...",
      "info"
    );


    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          phone: phone,

          password: password

        });


      if (error) {

        setMessage(
          "loginMessage",
          error.message,
          "error"
        );

        button.disabled = false;
        button.innerText = "Login";

        return;
      }


      showLoggedInUser(data.user);


    } catch (error) {

      setMessage(
        "loginMessage",
        error.message || "Login failed.",
        "error"
      );

      button.disabled = false;
      button.innerText = "Login";
    }
  }


  /* ==========================================
     SEND FORGOT PASSWORD OTP
     ========================================== */

  async function sendForgotOtp() {

    const phone =
      formatPhone(
        document.getElementById("forgotPhone").value
      );


    if (!phone) {

      setMessage(
        "forgotMessage",
        "Please enter your mobile number.",
        "error"
      );

      return;
    }


    const button =
      document.getElementById("forgotButton");

    button.disabled = true;

    button.innerText = "Sending OTP...";


    try {

      const { error } =
        await supabaseClient.auth.signInWithOtp({

          phone: phone,

          options: {
            shouldCreateUser: false,
            channel: "sms"
          }

        });


      if (error) {

        setMessage(
          "forgotMessage",
          error.message,
          "error"
        );

        button.disabled = false;
        button.innerText = "Send OTP";

        return;
      }


      document
        .getElementById("forgotOtpBox")
        .style.display = "block";


      setMessage(
        "forgotMessage",
        "OTP sent. Enter the OTP and choose your new password.",
        "success"
      );


      button.disabled = false;
      button.innerText = "Send OTP";


    } catch (error) {

      setMessage(
        "forgotMessage",
        error.message || "Unable to send OTP.",
        "error"
      );

      button.disabled = false;
      button.innerText = "Send OTP";
    }
  }


  /* ==========================================
     VERIFY FORGOT OTP AND CHANGE PASSWORD
     ========================================== */

  async function verifyForgotOtp() {

    const phone =
      formatPhone(
        document.getElementById("forgotPhone").value
      );

    const token =
      document
        .getElementById("forgotOtp")
        .value
        .trim();

    const newPassword =
      document.getElementById("newPassword").value;

    const confirmPassword =
      document.getElementById("confirmNewPassword").value;


    if (!token || token.length !== 6) {

      setMessage(
        "forgotMessage",
        "Please enter the 6-digit OTP.",
        "error"
      );

      return;
    }


    if (newPassword.length < 6) {

      setMessage(
        "forgotMessage",
        "New password must contain at least 6 characters.",
        "error"
      );

      return;
    }


    if (newPassword !== confirmPassword) {

      setMessage(
        "forgotMessage",
        "Passwords do not match.",
        "error"
      );

      return;
    }


    const button =
      document.getElementById("resetButton");

    button.disabled = true;

    button.innerText = "Verifying...";


    try {

      const { error } =
        await supabaseClient.auth.verifyOtp({

          phone: phone,

          token: token,

          type: "sms"

        });


      if (error) {

        setMessage(
          "forgotMessage",
          error.message,
          "error"
        );

        button.disabled = false;
        button.innerText =
          "Verify OTP & Change Password";

        return;
      }


      const { error: passwordError } =
        await supabaseClient.auth.updateUser({

          password: newPassword

        });


      if (passwordError) {

        setMessage(
          "forgotMessage",
          passwordError.message,
          "error"
        );

        button.disabled = false;
        button.innerText =
          "Verify OTP & Change Password";

        return;
      }


      setMessage(
        "forgotMessage",
        "Your password has been changed successfully.",
        "success"
      );


      setTimeout(() => {

        showForm("login");

        document.getElementById("forgotOtpBox")
          .style.display = "none";

      }, 1200);


    } catch (error) {

      setMessage(
        "forgotMessage",
        error.message || "Password reset failed.",
        "error"
      );

      button.disabled = false;
      button.innerText =
        "Verify OTP & Change Password";
    }
  }


  /* ==========================================
     SHOW LOGGED-IN USER
     ========================================== */

  function showLoggedInUser(user) {

    document
      .getElementById("authArea")
      .style.display = "none";

    document
      .getElementById("loggedInArea")
      .style.display = "block";


    const name =
      user?.user_metadata?.display_name || "Yaaroza User";

    const phone =
      user?.phone || "";


    document
      .getElementById("userName")
      .innerText = name;

    document
      .getElementById("userPhone")
      .innerText = phone;
  }


  /* ==========================================
     LOGOUT
     ========================================== */

  async function logoutUser() {

    const { error } =
      await supabaseClient.auth.signOut();


    if (error) {

      document
        .getElementById("logoutMessage")
        .innerText = error.message;

      return;
    }


    document
      .getElementById("loggedInArea")
      .style.display = "none";

    document
      .getElementById("authArea")
      .style.display = "block";


    showForm("login");

    setMessage(
      "loginMessage",
      "You have been logged out.",
      "success"
    );
  }


  /* ==========================================
     CHECK EXISTING SESSION
     ========================================== */

  async function checkSession() {

    const { data } =
      await supabaseClient.auth.getSession();


    if (data && data.session && data.session.user) {

      showLoggedInUser(data.session.user);
    }
  }


  checkSession();

</script>

</body>
</html>
