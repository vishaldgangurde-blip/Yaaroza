<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaaroza</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #0b0712;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  width: 100%;
  max-width: 430px;
  padding: 20px;
}

.logo {
  text-align: center;
  font-size: 42px;
  font-weight: 800;
  color: #b76cff;
  margin-bottom: 6px;
}

.tagline {
  text-align: center;
  color: #aaa;
  margin-bottom: 28px;
}

.card {
  background: #171020;
  border-radius: 22px;
  padding: 25px;
  box-shadow: 0 15px 45px rgba(0,0,0,.45);
}

h2 {
  text-align: center;
  margin: 0 0 22px;
}

input {
  display: block;
  width: 100%;
  padding: 15px;
  margin: 12px 0;
  border-radius: 12px;
  border: 1px solid #3a2948;
  background: #0e0a15;
  color: white;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #a855f7;
}

.main-btn {
  display: block;
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: 0;
  border-radius: 12px;
  background: #9333ea;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.main-btn:active {
  transform: scale(.98);
}

.link-btn {
  display: block;
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border: 0;
  background: transparent;
  color: #c084fc;
  font-size: 14px;
  cursor: pointer;
}

.hidden {
  display: none !important;
}

.message {
  text-align: center;
  color: #c084fc;
  margin-top: 15px;
  min-height: 20px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">YAAROZA</div>
  <div class="tagline">Meet • Talk • Play</div>

  <!-- LOGIN -->
  <div class="card" id="loginScreen">

    <h2>Welcome Back 👋</h2>

    <input
      type="tel"
      id="loginMobile"
      placeholder="Mobile Number"
      inputmode="numeric"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
    >

    <button class="main-btn" type="button" onclick="loginUser()">
      Login
    </button>

    <button class="link-btn" type="button" onclick="showCreateAccount()">
      Create Account
    </button>

    <button class="link-btn" type="button" onclick="showForgotPassword()">
      Forgot Password?
    </button>

    <div class="message" id="loginMessage"></div>

  </div>


  <!-- CREATE ACCOUNT -->
  <div class="card hidden" id="createScreen">

    <h2>Create Account 🚀</h2>

    <input
      type="tel"
      id="registerMobile"
      placeholder="Mobile Number"
      inputmode="numeric"
    >

    <input
      type="password"
      id="registerPassword"
      placeholder="Create Password"
    >

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm Password"
    >

    <button class="main-btn" type="button" onclick="createAccount()">
      Continue
    </button>

    <button class="link-btn" type="button" onclick="showLogin()">
      ← Back to Login
    </button>

    <div class="message" id="createMessage"></div>

  </div>


  <!-- FORGOT PASSWORD -->
  <div class="card hidden" id="forgotScreen">

    <h2>Reset Password 🔐</h2>

    <input
      type="tel"
      id="forgotMobile"
      placeholder="Mobile Number"
      inputmode="numeric"
    >

    <button class="main-btn" type="button" onclick="sendOTP()">
      Send OTP
    </button>

    <button class="link-btn" type="button" onclick="showLogin()">
      ← Back to Login
    </button>

    <div class="message" id="forgotMessage"></div>

  </div>

</div>


<script>

function hideAllScreens() {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("createScreen").classList.add("hidden");
  document.getElementById("forgotScreen").classList.add("hidden");
}

function showLogin() {
  hideAllScreens();
  document.getElementById("loginScreen").classList.remove("hidden");
}

function showCreateAccount() {
  hideAllScreens();
  document.getElementById("createScreen").classList.remove("hidden");
}

function showForgotPassword() {
  hideAllScreens();
  document.getElementById("forgotScreen").classList.remove("hidden");
}

function loginUser() {

  const mobile = document.getElementById("loginMobile").value.trim();
  const password = document.getElementById("loginPassword").value.trim();
  const message = document.getElementById("loginMessage");

  if (mobile === "" || password === "") {
    message.textContent = "Please enter mobile number and password.";
    return;
  }

  message.textContent = "Login system will be connected soon.";
}

function createAccount() {

  const mobile = document.getElementById("registerMobile").value.trim();
  const password = document.getElementById("registerPassword").value;
  const confirm = document.getElementById("confirmPassword").value;
  const message = document.getElementById("createMessage");

  if (mobile === "" || password === "" || confirm === "") {
    message.textContent = "Please fill all details.";
    return;
  }

  if (password !== confirm) {
    message.textContent = "Passwords do not match.";
    return;
  }

  message.textContent = "OTP verification will be connected next.";
}

function sendOTP() {

  const mobile = document.getElementById("forgotMobile").value.trim();
  const message = document.getElementById("forgotMessage");

  if (mobile === "") {
    message.textContent = "Please enter your mobile number.";
    return;
  }

  message.textContent = "OTP password recovery will be connected next.";
}

</script>

</body>
</html>
