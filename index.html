<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yaaroza</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .tagline {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      padding: 11px 5px;
      border: none;
      border-radius: 10px;
      background: #eee;
      cursor: pointer;
      font-weight: bold;
    }

    .tab.active {
      background: #2575fc;
      color: white;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2575fc;
    }

    button.main-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2575fc;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button.main-btn:hover {
      opacity: 0.9;
    }

    .password-wrap {
      position: relative;
      width: 100%;
    }

    .password-wrap input {
      width: 100%;
      padding-right: 50px;
      box-sizing: border-box;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
      padding: 5px;
      margin: 0;
      width: auto;
    }

    .secondary-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #eee;
      color: #333;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #444;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .hidden {
      display: none;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #777;
    }

    .welcome {
      text-align: center;
    }

    .welcome h2 {
      margin-bottom: 10px;
    }

    .user-info {
      background: #f5f5f5;
      border-radius: 12px;
      padding: 15px;
      margin: 20px 0;
      text-align: center;
    }

    .user-info p {
      margin: 7px 0;
    }

    .link-btn {
      background: none;
      border: none;
      color: #2575fc;
      cursor: pointer;
      font-weight: bold;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">Yaaroza</div>
    <div class="tagline">Connect • Chat • Call • Make Friends</div>

    <!-- AUTH SECTION -->
    <div id="authSection">

      <div class="tabs">
        <button class="tab active" id="loginTab" onclick="showForm('login')">
          Login
        </button>

        <button class="tab" id="signupTab" onclick="showForm('signup')">
          Create Account
        </button>

        <button class="tab" id="forgotTab" onclick="showForm('forgot')">
          Forgot
        </button>
      </div>


      <!-- LOGIN FORM -->
      <div id="loginForm">

        <h2>Welcome Back</h2>

        <input
          id="loginPhone"
          type="tel"
          placeholder="Mobile Number"
          required
        >

        <div class="password-wrap">
          <input
            id="loginPassword"
            type="password"
            placeholder="Password"
            required
          >

          <button
            type="button"
            class="toggle-password"
            onclick="togglePassword('loginPassword', this)"
          >👁️</button>
        </div>

        <button class="main-btn" onclick="loginUser()">
          Login
        </button>

        <div id="loginMessage" class="message"></div>

      </div>


      <!-- SIGNUP FORM -->
      <div id="signupForm" class="hidden">

        <h2>Create Your Account</h2>

        <input
          id="signupName"
          type="text"
          placeholder="Your Name"
          required
        >

        <input
          id="signupPhone"
          type="tel"
          placeholder="Mobile Number"
          required
        >

        <div class="password-wrap">
          <input
            id="signupPassword"
            type="password"
            placeholder="Password"
            required
          >

          <button
            type="button"
            class="toggle-password"
            onclick="togglePassword('signupPassword', this)"
          >👁️</button>
        </div>

        <div class="password-wrap">
          <input
            id="signupConfirmPassword"
            type="password"
            placeholder="Confirm Password"
            required
          >

          <button
            type="button"
            class="toggle-password"
            onclick="togglePassword('signupConfirmPassword', this)"
          >👁️</button>
        </div>

        <button class="main-btn" onclick="createAccount()">
          Create Account
        </button>

        <div id="signupMessage" class="message"></div>


        <!-- SIGNUP OTP -->
        <div id="signupOtpSection" class="hidden">

          <input
            id="signupOtp"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="Enter 6-digit OTP"
          >

          <button class="main-btn" onclick="verifySignupOtp()">
            Verify OTP
          </button>

          <button class="secondary-btn" onclick="resendSignupOtp()">
            Resend OTP
          </button>

          <div id="signupOtpMessage" class="message">
            OTP sent. Enter the 6-digit OTP to verify your phone.
          </div>

        </div>

      </div>


      <!-- FORGOT PASSWORD -->
      <div id="forgotForm" class="hidden">

        <h2>Reset Password</h2>

        <input
          id="forgotPhone"
          type="tel"
          placeholder="Mobile Number"
          required
        >

        <button class="main-btn" onclick="sendForgotOtp()">
          Send OTP
        </button>

        <div id="forgotMessage" class="message"></div>


        <!-- FORGOT OTP SECTION -->
        <div id="forgotOtpSection" class="hidden">

          <input
            id="forgotOtp"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="Enter 6-digit OTP"
          >

          <div class="password-wrap">
            <input
              id="newPassword"
              type="password"
              placeholder="New Password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              onclick="togglePassword('newPassword', this)"
            >👁️</button>
          </div>

          <button class="main-btn" onclick="resetPassword()">
            Reset Password
          </button>

          <div id="resetMessage" class="message"></div>

        </div>

      </div>

    </div>


    <!-- LOGGED IN SECTION -->
    <div id="loggedInSection" class="hidden">

      <div class="welcome">

        <h2>Welcome to Yaaroza</h2>

        <p>You are successfully logged in.</p>

        <div class="user-info">

          <p>
            <strong>Name:</strong>
            <span id="userName">User</span>
          </p>

          <p>
            <strong>Mobile:</strong>
            <span id="userPhone"></span>
          </p>

        </div>

        <button class="main-btn" onclick="logoutUser()">
          Logout
        </button>

      </div>

    </div>


    <div class="footer">
      By continuing, you agree to Yaaroza's Terms & Privacy Policy.
    </div>

  </div>

</div>


<script>

  /* ==============================
     SUPABASE CONFIGURATION
  ============================== */

  const SUPABASE_URL =
    "https://qkpljuksfgyyooythbjg.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_GQG4XSSgd7_eBOe18DkkMA_7PBuNZId";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* ==============================
     FORM SWITCHING
  ============================== */

  function showForm(form) {

    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("signupForm").classList.add("hidden");
    document.getElementById("forgotForm").classList.add("hidden");

    document.getElementById("loginTab").classList.remove("active");
    document.getElementById("signupTab").classList.remove("active");
    document.getElementById("forgotTab").classList.remove("active");

    if (form === "login") {

      document.getElementById("loginForm").classList.remove("hidden");
      document.getElementById("loginTab").classList.add("active");

    }

    if (form === "signup") {

      document.getElementById("signupForm").classList.remove("hidden");
      document.getElementById("signupTab").classList.add("active");

    }

    if (form === "forgot") {

      document.getElementById("forgotForm").classList.remove("hidden");
      document.getElementById("forgotTab").classList.add("active");

    }

  }


  /* ==============================
     PHONE FORMAT
  ============================== */

  function formatPhone(phone) {

    phone = phone.trim();

    if (phone.startsWith("+91")) {
      return phone;
    }

    if (phone.startsWith("91") && phone.length === 12) {
      return "+" + phone;
    }

    if (phone.length === 10) {
      return "+91" + phone;
    }

    return phone;
  }


  /* ==============================
     PASSWORD SHOW / HIDE
  ============================== */

  function togglePassword(inputId, button) {

    const input =
      document.getElementById(inputId);

    if (input.type === "password") {

      input.type = "text";
      button.textContent = "🙈";

    } else {

      input.type = "password";
      button.textContent = "👁️";

    }

  }


  /* ==============================
     CREATE ACCOUNT
  ============================== */

  async function createAccount() {

    const name =
      document.getElementById("signupName").value.trim();

    const phone =
      formatPhone(
        document.getElementById("signupPhone").value
      );

    const password =
      document.getElementById("signupPassword").value;

    const confirmPassword =
      document.getElementById("signupConfirmPassword").value;

    const message =
      document.getElementById("signupMessage");


    message.className = "message";


    if (!name || !phone || !password || !confirmPassword) {

      message.textContent =

      message.classList.add("error
