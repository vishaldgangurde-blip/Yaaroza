<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yaaroza</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #09090f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      color: transparent;
    }

    .tagline {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .card {
      background: #15151f;
      border: 1px solid #292938;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 13px;
      border-radius: 12px;
      border: 1px solid #353548;
      background: #0d0d15;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #8b5cf6;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:disabled {
      opacity: .6;
    }

    .links {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      font-size: 14px;
    }

    .link {
      color: #b084ff;
      cursor: pointer;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }

    .otp-title {
      text-align: center;
      color: #aaa;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .otp-container {
      display: flex;
      gap: 7px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .otp {
      width: 45px;
      height: 52px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      padding: 0;
      margin: 0;
    }

    .back {
      text-align: center;
      margin-top: 18px;
      color: #aaa;
      cursor: pointer;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .success {
      color: #4ade80;
    }

    .error {
      color: #fb7185;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">Yaaroza</div>
  <div class="tagline">Meet • Talk • Play</div>

  <!-- LOGIN -->
  <div class="card" id="loginScreen">

    <h2>Welcome Back</h2>

    <input
      id="loginPhone"
      type="tel"
      placeholder="Mobile number (+91...)"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
    >

    <button onclick="loginUser()">Login</button>

    <div class="links">
      <span class="link" onclick="showCreateAccount()">Create Account</span>
      <span class="link" onclick="showForgotPassword()">Forgot Password?</span>
    </div>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- CREATE ACCOUNT -->
  <div class="card hidden" id="createScreen">

    <h2>Create Account</h2>

    <input
      id="signupPhone"
      type="tel"
      placeholder="Mobile number (+91...)"
    >

    <input
      id="signupPassword"
      type="password"
      placeholder="Create password"
    >

    <input
      id="signupUsername"
      type="text"
      placeholder="Username"
    >

    <input
      id="signupFullName"
      type="text"
      placeholder="Full name"
    >

    <button id="signupButton" onclick="createAccount()">
      Send OTP
    </button>

    <div id="signupMessage" class="message"></div>

    <div class="back" onclick="showLogin()">
      ← Back to Login
    </div>

  </div>


  <!-- OTP -->
  <div class="card hidden" id="otpScreen">

    <h2>Verify Your Phone</h2>

    <div class="otp-title">
      We've sent a 6-digit verification code to<br>
      <strong id="otpPhoneText"></strong>
    </div>

    <div class="otp-container">

      <input class="otp" maxlength="1" inputmode="numeric" oninput="moveOTP(this, 0)">
      <input class="otp" maxlength="1" inputmode="numeric" oninput="moveOTP(this, 1)">
      <input class="otp" maxlength="1" inputmode="numeric" oninput="moveOTP(this, 2)">
      <input class="otp" maxlength="1" inputmode="numeric" oninput="moveOTP(this, 3)">
      <input class="otp" maxlength="1" inputmode="numeric" oninput="moveOTP(this, 4)">
      <input class="otp" maxlength="1" inputmode="numeric" oninput="moveOTP(this, 5)">

    </div>

    <button id="verifyButton" onclick="verifyOTP()">
      Verify OTP
    </button>

    <button
      id="resendButton"
      onclick="resendOTP()"
      style="background:#292938;margin-top:12px;"
    >
      Resend OTP
    </button>

    <div id="otpMessage" class="message"></div>

  </div>


  <!-- FORGOT PASSWORD -->
  <div class="card hidden" id="forgotScreen">

    <h2>Forgot Password</h2>

    <input
      id="forgotPhone"
      type="tel"
      placeholder="Mobile number (+91...)"
    >

    <button onclick="sendForgotOTP()">
      Send OTP
    </button>

    <div id="forgotMessage" class="message"></div>

    <div class="back" onclick="showLogin()">
      ← Back to Login
    </div>

  </div>

</div>


<script>

  // ==============================
  // SUPABASE CONFIGURATION
  // ==============================

  const SUPABASE_URL =
    "https://qkpljuksfgyyooythbjg.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_GQG4XSSgd7_eBOe18DkkMA_7PBuNZId";

  const client = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  // ==============================
  // SCREEN CONTROL
  // ==============================

  function hideAllScreens() {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("createScreen").classList.add("hidden");
    document.getElementById("otpScreen").classList.add("hidden");
    document.getElementById("forgotScreen").classList.add("hidden");
  }

  function showLogin() {
    hideAllScreens();
    document.getElementById("loginScreen").classList.remove("hidden");
  }

  function showCreateAccount() {
    hideAllScreens();
    document.getElementById("createScreen").classList.remove("hidden");
  }

  function showForgotPassword() {
    hideAllScreens();
    document.getElementById("forgotScreen").classList.remove("hidden");
  }


  // ==============================
  // CREATE ACCOUNT
  // ==============================

  async function createAccount() {

    const phone =
      document.getElementById("signupPhone").value.trim();

    const password =
      document.getElementById("signupPassword").value;

    const username =
      document.getElementById("signupUsername").value.trim();

    const fullName =
      document.getElementById("signupFullName").value.trim();

    const message =
      document.getElementById("signupMessage");

    const button =
      document.getElementById("signupButton");

    message.className = "message";

    if (!phone || !password || !username || !fullName) {
      message.textContent = "Please fill all fields.";
      message.classList.add("error");
      return;
    }

    if (password.length < 6) {
      message.textContent =
        "Password must be at least 6 characters.";
      message.classList.add("error");
      return;
    }

    button.disabled = true;
    button.textContent = "Sending OTP...";

    try {

      const { data, error } =
        await client.auth.signUp({
          phone: phone,
          password: password
        });

      if (error) {
        throw error;
      }

      // Save registration information temporarily
      sessionStorage.setItem(
        "yaaroza_phone",
        phone
      );

      sessionStorage.setItem(
        "yaaroza_username",
        username
      );

      sessionStorage.setItem(
        "yaaroza_full_name",
        fullName
      );

      document.getElementById("otpPhoneText").textContent =
        phone;

      hideAllScreens();
      document.getElementById("otpScreen").classList.remove("hidden");

      document.querySelector(".otp").focus();

      document.getElementById("otpMessage").textContent =
        "OTP sent successfully.";

      document.getElementById("otpMessage").classList.add("success");

    } catch (error) {

      message.textContent =
        error.message || "Unable to send OTP.";

      message.classList.add("error");

    } finally {

      button.disabled = false;
      button.textContent = "Send OTP";

    }
  }


  // ==============================
  // OTP INPUT
  // ==============================

  function moveOTP(input, index) {

    input.value =
      input.value.replace(/[^0-9]/g, "");

    const boxes =
      document.querySelectorAll(".otp");

    if (input.value && index < 5) {
      boxes[index + 1].focus();
    }
  }


  // ==============================
  // VERIFY OTP
  // ==============================

  async function verifyOTP() {

    const boxes =
      document.querySelectorAll(".otp");

    let otp = "";

    boxes.forEach(box => {
      otp += box.value;
    });

    const phone =
      sessionStorage.getItem("yaaroza_phone");

    const username =
      sessionStorage.getItem("yaaroza_username");

    const fullName =
      sessionStorage.getItem("yaaroza_full_name");

    const message =
      document.getElementById("otpMessage");

    const button =
      document.getElementById("verifyButton");

    if (otp.length !== 6) {
      message.textContent =
        "Please enter the 6-digit OTP.";
      message.className = "message error";
      return;
    }

    button.disabled = true;
    button.textContent = "Verifying...";

    try {

      const { data, error } =
        await client.auth.verifyOtp({
          phone: phone,
          token: otp,
          type: "sms"
        });

      if (error) {
        throw error;
      }

      const user =
        data.user;

      if (user) {

        const { error: profileError } =
          await client
            .from("profiles")
            .update({
              username: username,
              full_name: fullName
            })
            .eq("id", user.id
